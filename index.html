function sfReviewRecords(){return SF_REVIEW_PICKS.map((p,i)=>({id:pid(p[0]),name:p[0],city:'San Francisco',category:p[1],lat:null,lng:null,image:'',fallback:'',status:'want',favorite:false,day:'',notes:p[2]+' · '+p[3]+' · Curated from 2026 SF dining and activity guides',added_by:'SF 2026 guide',updated_by:'SF 2026 guide',sort:DEFAULTS.length+FOOD_PICKS.length+i}))}
async function importSFReviews(){if(sb&&!user){alert('Sign in to add shared places');return}const known=new Set(items.map(p=>pid(p.name)));let count=0;for(const p of sfReviewRecords()){if(known.has(pid(p.name)))continue;if(!await save(p))break;items.push(p);known.add(pid(p.name));count++}if(!sb)saveLocal();render();alert(count?count+' SF recommendations added.':'These recommendations are already on the board.');}
function seed(){return DEFAULTS.map((p,i)=>({id:pid(p[0]),name:p[0],city:p[1],category:p[2],lat:p[3],lng:p[4],image:'',fallback:p[5],status:'want',favorite:false,day:Object.keys(schedule).find(k=>schedule[k].includes(p[0]))||'',notes:'',added_by:'Trip starter',updated_by:'Trip starter',sort:i})).concat(foodPickRecords().filter(p=>!DEFAULTS.some(x=>pid(x[0])===pid(p.name)))).concat(sfReviewRecords().filter(p=>!DEFAULTS.some(x=>pid(x[0])===pid(p.name))&&!FOOD_PICKS.some(x=>pid(x[0])===pid(p.name))))}
let items=[],sb=null,user=null,tab='Places',filter='',cityFilter='All',selectedDay='2026-11-03',map=null,markers=[],sortMode='';const configKey='cb-config-v1',localKey='cb-local-v1';const cfg=JSON.parse(localStorage.getItem(configKey)||'{}');
function saveLocal(){localStorage.setItem(localKey,JSON.stringify(items))}function mode(){document.getElementById('mode').textContent=sb?(user?'Shared · '+(user.user_metadata?.full_name||user.email):'Sign in to collaborate'):'Local preview · not shared';document.getElementById('accountBtn').textContent=user?'Account':'Connect & share'}
async function boot(){let stored=localStorage.getItem(localKey);items=stored?JSON.parse(stored):seed();if(cfg.url&&cfg.key){sb=window.supabase.createClient(cfg.url,cfg.key);const {data}=await sb.auth.getUser();user=data.user;sb.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;mode();if(user)await loadShared();render()});if(user)await loadShared();}mode();render()}
async function loadShared(){if(!sb||!user)return;const {data,error}=await sb.from('places').select('*').order('sort');if(error){alert('Cannot load shared places: '+error.message);return}items=data||[];if(!items.length){document.getElementById('mode').textContent='Shared · empty board';}}
async function save(item,removed=false){if(sb){if(!user){alert('Sign in to edit the shared trip');return false}let response=removed?await sb.from('places').delete().eq('id',item.id):await sb.from('places').upsert(item);if(response.error){alert('Could not save: '+response.error.message);return false}}else saveLocal();return true}
async function updateItem(id,patch){let old=items.find(p=>p.id===id);if(!old)return;const next={...old,...patch,updated_by:user?.user_metadata?.full_name||user?.email||'Local user'};let ok=await save(next);if(!ok)return;items=items.map(p=>p.id===id?next:p);render()}
function mapUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat!=null&&p.lng!=null?p.lat+','+p.lng:p.name+' '+p.city)}
function km(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dx=(b.lng-a.lng)*r;return 6371*2*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dx/2)**2))}
function nearbySuggestions(){const favorites=items.filter(p=>p.favorite&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng)));const unscheduled=favorites.filter(p=>!p.day);const clusters=[];for(const p of unscheduled){let group=clusters.find(g=>g.some(q=>km(p,q)<12));if(group)group.push(p);else clusters.push([p]);}return clusters.sort((a,b)=>b.length-a.length)}
function suggestSchedule(){const groups=nearbySuggestions();const html=groups.length?groups.map((group,i)=>`<section class="suggestgroup"><h3>Route idea ${i+1}: ${esc(group[0].city)}</h3><p class="tiny">${group.length} liked places clustered by straight-line distance (not driving time).</p>${group.map(p=>`<div class="activity"><span class="suggestplace"><img data-place-id="${esc(p.id)}" src="${esc(photo(p))}" onerror="imageError(this)" alt="" class="checkthumb"> ♥ ${esc(p.name)} <small>${esc(p.city)}</small></span><button class="iconbtn" onclick="quickSchedule('${p.id}')">＋ Day</button></div>`).join('')}<a class="secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&${group.length===1?'destination='+encodeURIComponent(group[0].lat+','+group[0].lng):'origin='+encodeURIComponent(group[0].lat+','+group[0].lng)+'&destination='+encodeURIComponent(group[group.length-1].lat+','+group[group.length-1].lng)+(group.length>2?'&waypoints='+encodeURIComponent(group.slice(1,-1).map(x=>x.lat+','+x.lng).join('|')):'')}&travelmode=driving">View route in Google Maps ↗</a></section>`).join(''):'<p class="empty">Heart some places first. Unscheduled favorites will appear here in nearby groups.</p>';document.getElementById('content').innerHTML=toolbar('Plans from your favorites',groups.reduce((n,g)=>n+g.length,0),false)+'<p class="stats">Ideas group your liked, unscheduled places by proximity. Add the stops to a day to create your itinerary.</p>'+html}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const photoCache={};const pendingPhotos=new Set();
function photo(p){return p.image||photoCache[p.id]||(p.fallback?`https://images.unsplash.com/${p.fallback}?w=600&q=70`:placeholder(p))}
function placeholder(p){return `https://placehold.co/640x460/25282c/d9d9d4/png?text=${encodeURIComponent((p.name||'California').slice(0,28))}`}
function imageError(img){img.onerror=null;const p=items.find(x=>x.id===img.dataset.placeId);img.src=placeholder(p||{name:'California'});img.style.display='block'}
function wikiSearchName(p){const names={'Fisherman’s Wharf':'Fishermans Wharf San Francisco','Ferry Building Marketplace':'San Francisco Ferry Building','Campanile':'Sather Tower','Painted Ladies':'Painted Ladies San Francisco','Cholita Linda':'Cholita Linda restaurant','Humphry Slocombe':'Humphry Slocombe','Alcatraz Bay cruise':'Alcatraz Island','Mountain Room Restaurant':'Yosemite Valley Lodge','Sausalito Waterfront':'Sausalito California','17-Mile Drive':'17-Mile Drive California','Old Fisherman’s Wharf':'Old Fishermans Wharf Monterey','The Tech Interactive':'The Tech Interactive San Jose'};return names[p.name]||p.name+' '+p.city}
async function lookupPhoto(p){if(p.image||photoCache[p.id]||pendingPhotos.has(p.id))return;pendingPhotos.add(p.id);try{const q=wikiSearchName(p);const api='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=720&format=json&origin=*';const response=await fetch(api);if(!response.ok)throw Error('Photo source unavailable');const json=await response.json();const pages=Object.values(json.query?.pages||{}).filter(x=>x.thumbnail?.source);const selected=pages.find(x=>{const title=x.title.toLowerCase(),main=p.name.toLowerCase().replace(/[’']/g,'');return title.includes(main)||main.includes(title)})||pages.find(x=>{const title=x.title.toLowerCase();return p.name.toLowerCase().split(' ').some(w=>w.length>5&&title.includes(w))});if(selected){photoCache[p.id]=selected.thumbnail.source;document.querySelectorAll(`img[data-place-id="${CSS.escape(p.id)}"]`).forEach(img=>{if(!p.image)img.src=selected.thumbnail.source})}}catch(e){}finally{pendingPhotos.delete(p.id)}}
function loadVisiblePhotos(){const elements=[...document.querySelectorAll('img[data-place-id]')];if(!elements.length)return;const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){const id=e.target.dataset.placeId,p=items.find(x=>x.id===id);if(p)lookupPhoto(p);observer.unobserve(e.target)}})},{rootMargin:'500px'});elements.forEach(el=>observer.observe(el))}

function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`}function closeModal(e){if(!e||e.target.classList.contains('modal-back'))document.getElementById('modalRoot').innerHTML=''}
function showAdd(id){const p=id?items.find(a=>a.id===id):null;modal(`<h2>${p?'Edit place':'Add to the board'}</h2><p class="tiny">Photos are sourced from Wikipedia where possible. Add an image URL to override the automatic suggestion. Other images are illustrative.</p><form id="addForm"><label>Name</label><input name="name" value="${esc(p?.name||'')}" required><label>City / region</label><input name="city" value="${esc(p?.city||'')}" required><label>Category</label><select name="category">${['Sights','Museum','Nature','Shopping','Experience','Restaurant'].map(x=>`<option ${p?.category===x?'selected':''}>${x}</option>`)}</select><label>Image URL (optional)</label><input name="image" value="${esc(p?.image||'')}" placeholder="https://..."><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Latitude</label><input type="number" step="any" name="lat" value="${p?.lat??''}"></div><div><label>Longitude</label><input type="number" step="any" name="lng" value="${p?.lng??''}"></div></div><label>Day</label><select name="day"><option value="">Unscheduled</option>${dates().map(x=>`<option value="${x}" ${p?.day===x?'selected':''}>${fmt(x)}</option>`)}</select><label>Notes</label><textarea name="notes" rows="3">${esc(p?.notes||'')}</textarea><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save place</button></div></form>`);document.getElementById('addForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());const name=d.name.trim(),newId=p?.id||pid(name)+'-'+Math.random().toString(36).slice(2,6);const o={...(p||{}),id:newId,name,city:d.city,category:d.category,image:d.image,fallback:p?.fallback||'photo-1501594907352-04cda38ebc29',lat:d.lat?+d.lat:null,lng:d.lng?+d.lng:null,day:d.day,notes:d.notes,status:p?.status||'want',added_by:p?.added_by||user?.user_metadata?.full_name||user?.email||'Local user',updated_by:user?.user_metadata?.full_name||user?.email||'Local user',sort:p?.sort??items.length};if(await save(o)){items=p?items.map(x=>x.id===p.id?o:x):[...items,o];closeModal();render()}}}
function showAccount(){modal(`<h2>Connect your shared board</h2>${sb?`<div class="notice">Supabase is configured. ${user?'You are signed in as '+esc(user.email):'Sign in below to access the board.'}</div>`:`<div class="notice">This browser is currently in a local preview: changes are not shared. Follow README.md and setup.sql to enable private shared storage.</div>`}<label>Supabase project URL</label><input id="url" value="${esc(cfg.url||'')}" placeholder="https://your-project.supabase.co"><label>Supabase publishable / anon key</label><input id="key" value="${esc(cfg.key||'')}" placeholder="sb_publishable_..."><button class="secondary" style="margin-top:8px" onclick="saveConfig()">Save connection</button>${sb?`<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">${user?`<button class="secondary" onclick="logout()">Sign out</button><button class="secondary" onclick="importStarter()">Import starter places (if board is empty)</button>`:`<label>Your email</label><input id="email" type="email" placeholder="you@example.com"><label>Your display name</label><input id="displayName" placeholder="Ece / Albert / Kaan / Işıl"><button style="margin-top:12px" class="primary" onclick="login()">Send sign-in email</button>`}`:''}<div class="actions"><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function saveConfig(){const url=document.getElementById('url').value.trim(),key=document.getElementById('key').value.trim();localStorage.setItem(configKey,JSON.stringify({url,key}));location.reload()}
async function login(){const email=document.getElementById('email').value.trim(),full_name=document.getElementById('displayName').value.trim();const {error}=await sb.auth.signInWithOtp({email,options:{data:{full_name},emailRedirectTo:location.origin+location.pathname}});alert(error?error.message:'Check your email for a sign-in link. Your email must be included in the project invite list.')}
async function logout(){await sb.auth.signOut();location.reload()}
async function importStarter(){if(items.length){alert('Board already contains places.');return}for(let i=0;i<seed().length;i+=25){const {error}=await sb.from('places').insert(seed().slice(i,i+25).map(x=>({...x,added_by:user.user_metadata?.full_name||user.email,updated_by:user.user_metadata?.full_name||user.email})));if(error){alert('Import failed: '+error.message);return}}await loadShared();closeModal();render()}
function dates(){return Array.from({length:12},(_,i)=>'2026-11-'+String(i+3).padStart(2,'0'))}function fmt(date){return new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function tile(p){return `<article class="tile"><div class="tilepic"><img class="photo" data-place-id="${esc(p.id)}" style="--pictureHeight:${190+(p.sort||0)%4*29}px" loading="lazy" src="${esc(photo(p))}" onerror="imageError(this)" alt="${esc(p.name)}"><button class="heart ${p.favorite?'hearted':''}" title="${p.favorite?'Unlike':'Like'}" aria-label="Toggle favorite" onclick="updateItem('${p.id}',{favorite:${!p.favorite}})">${p.favorite?'♥':'♡'}</button></div><div class="body"><div class="tags">${esc(p.city)} · ${esc(p.category)}</div><h3>${esc(p.name)}</h3><p>${esc(p.notes||('Added by '+p.added_by))}</p><div class="bottom"><button class="iconbtn" title="Mark visited" onclick="updateItem('${p.id}',{status:'${p.status==='visited'?'want':'visited'}'})">${p.status==='visited'?'☑ Visited':'☐ To visit'}</button><a class="iconbtn" title="Open in Google Maps" href="${mapUrl(p)}" target="_blank" rel="noopener">⌖ Map ↗</a><button class="iconbtn" onclick="showAdd('${p.id}')">✎</button><button class="iconbtn" onclick="quickSchedule('${p.id}')">＋ Day</button></div>${p.day?`<div class="tiny" style="margin-top:8px">📅 ${fmt(p.day)}</div>`:''}</div></article>`}
function quickSchedule(id){const p=items.find(p=>p.id===id);modal(`<h2>Schedule ${esc(p.name)}</h2><label>Choose a day</label><select id="chooseDay"><option value="">Unscheduled</option>${dates().map(d=>`<option ${p.day===d?'selected':''} value="${d}">${fmt(d)}</option>`)}</select><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="updateItem('${id}',{day:document.getElementById('chooseDay').value});closeModal()">Save</button></div>`)}
function tabs(){return ['Places','Restaurants','Favorites','Ideas','Map','Calendar','Checklist'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';filter='';cityFilter='All';render()">${{Places:'✦',Restaurants:'◉',Favorites:'♥',Ideas:'✧',Map:'⌖',Calendar:'▦',Checklist:'☑'}[t]} &nbsp;${t}</button>`).join('')}
function toolbar(title,count,filters=true){return `<div class="toolbar"><div><h2>${title}</h2><div class="stats">${count} saved places · ${items.filter(p=>p.status==='visited').length} visited</div></div><div class="controls">${filters?`<input class="field" placeholder="Search places…" value="${esc(filter)}" oninput="filter=this.value;renderContent()"><select class="field" onchange="cityFilter=this.value;renderContent()"><option value="All">All regions</option>${[...new Set(items.map(p=>p.city))].sort().map(c=>`<option ${cityFilter===c?'selected':''}>${esc(c)}</option>`)}</select>`:''}<button class="primary" onclick="showAdd()">＋ Add</button></div></div>`}
function subset(){return items.filter(p=>(tab==='Restaurants'?p.category==='Restaurant':tab==='Places'?p.category!=='Restaurant':tab==='Favorites'?!!p.favorite:true)&&(!filter||[p.name,p.city,p.category].join(' ').toLowerCase().includes(filter.toLowerCase()))&&(cityFilter==='All'||p.city===cityFilter))}
function renderContent(){const c=document.getElementById('content');if(tab==='Ideas'){suggestSchedule()}else if(tab==='Places'||tab==='Restaurants'||tab==='Favorites'){let list=subset();c.innerHTML=toolbar(tab==='Places'?'The places board':tab==='Favorites'?'Your liked places':'Food & good finds',list.length)+(tab==='Restaurants'?'<div style="margin-bottom:18px"><button class="secondary" onclick="importFoodPicks()">＋ Import Ece’s Berkeley food list</button><button class="secondary" onclick="importSFReviews()">＋ Import SF review picks</button><span class="tiny" style="margin-left:10px">Includes casual, sit-down and special-occasion picks; duplicates skipped.</span></div>':'')+`<div class="masonry">${list.map(tile).join('')||'<div class="empty">No matching places</div>'}</div>`;loadVisiblePhotos()}else if(tab==='Map'){c.innerHTML=toolbar('Everything, on a map',items.length,false)+`<div class="controls" style="margin-bottom:12px"><select class="field" id="mapCategory" onchange="drawMap()"><option value="All">All categories</option>${[...new Set(items.map(p=>p.category))].map(c=>`<option>${c}</option>`)}</select><select class="field" id="mapDay" onchange="drawMap()"><option value="All">All days</option><option value="">Unscheduled</option>${dates().map(d=>`<option value="${d}">${fmt(d)}</option>`)}</select><a class="secondary" href="https://www.google.com/maps" target="_blank" rel="noopener">Open Google Maps ↗</a></div><div class="maplayout"><div id="maplist" class="maplist"></div><div id="map"></div></div>`;initMap()}else if(tab==='Calendar'){const count=items.filter(x=>x.day).length;c.innerHTML=toolbar('A little adventure, every day',count,false)+`<div class="calendar">${dates().map(d=>`<div class="day ${selectedDay===d?'selected':''}" onclick="selectedDay='${d}';renderContent()"><small>${fmt(d).split(',')[0]}</small><b>${new Date(d+'T12:00:00').getDate()}</b>${items.filter(p=>p.day===d).slice(0,4).map(p=>`<div class="event"><img data-place-id="${esc(p.id)}" src="${esc(photo(p))}" onerror="imageError(this)" alt="" class="eventthumb">${esc(p.name)}</div>`).join('')}${items.filter(p=>p.day===d).length>4?'<small>More…</small>':''}</div>`).join('')}</div><div class="detailday"><h2 style="font-family:Georgia,serif;margin-top:0">${fmt(selectedDay)} · Day plan</h2>${items.filter(p=>p.day===selectedDay).map(p=>`<div class="activity"><img data-place-id="${esc(p.id)}" src="${esc(photo(p))}" onerror="imageError(this)" alt="" class="activitythumb"><div><b>${esc(p.name)}</b><div class="tiny">${esc(p.city)} · Added by ${esc(p.added_by)}</div></div><div><button class="iconbtn" onclick="quickSchedule('${p.id}')">Move</button> <button class="iconbtn" onclick="updateItem('${p.id}',{day:''})">×</button></div></div>`).join('')||'<p class="tiny">Nothing scheduled yet.</p>'}<button class="primary" style="margin-top:16px" onclick="dayPicker()">＋ Schedule a place</button> <button class="secondary" onclick="dayDirections()">Driving directions ↗</button></div>`}else{const done=items.filter(p=>p.status==='visited').length;c.innerHTML=toolbar('The whole wish list',items.length,false)+`<p class="stats">${done}/${items.length} explored · Check places off as you go.</p><div class="checklist">${items.map(p=>`<label class="checkitem"><input type="checkbox" ${p.status==='visited'?'checked':''} onchange="updateItem('${p.id}',{status:this.checked?'visited':'want'})"><img data-place-id="${esc(p.id)}" src="${esc(photo(p))}" onerror="imageError(this)" alt="" class="checkthumb"><span style="flex:1"><b>${esc(p.name)}</b><span class="tiny" style="display:block">${esc(p.city)} · ${esc(p.category)}</span></span><button class="iconbtn" onclick="event.preventDefault();showAdd('${p.id}')">✎</button></label>`).join('')}</div>`}}
function dayPicker(){modal(`<h2>Add to ${fmt(selectedDay)}</h2><label>Choose a saved place</label><select id="pickPlace">${items.filter(p=>p.day!==selectedDay).map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.city)}</option>`)}</select><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="updateItem(document.getElementById('pickPlace').value,{day:'${selectedDay}'});closeModal()">Add to day</button></div>`)}
function dayDirections(){const ps=items.filter(p=>p.day===selectedDay&&p.lat!=null&&p.lng!=null);if(!ps.length){alert('No mapped places in this day.');return}const path=ps.map(p=>p.lat+','+p.lng);const u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(path[0])+'&destination='+encodeURIComponent(path[path.length-1])+'&travelmode=driving'+(path.length>2?'&waypoints='+encodeURIComponent(path.slice(1,-1).join('|')):'');window.open(u,'_blank','noopener')}
function initMap(){if(map){map.remove();map=null}map=L.map('map').setView([37.63,-121.99],8);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);drawMap();setTimeout(()=>map.invalidateSize(),100)}function drawMap(){if(!map)return;markers.forEach(m=>map.removeLayer(m));markers=[];const cat=document.getElementById('mapCategory').value,day=document.getElementById('mapDay').value;const ps=items.filter(p=>p.lat!=null&&p.lng!=null&&(cat==='All'||p.category===cat)&&(day==='All'||p.day===day));document.getElementById('maplist').innerHTML=ps.map(p=>`<div class="maprow" onclick="focusPin('${p.id}')"><img data-place-id="${esc(p.id)}" src="${esc(photo(p))}" onerror="imageError(this)"><div><b>${esc(p.name)}</b><span class="tiny">${esc(p.city)} · ${esc(p.category)}</span><div><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" onclick="event.stopPropagation()">Directions ↗</a></div></div></div>`).join('')||'<div class="empty">No mapped places</div>';const colors={Restaurant:'#a65744',Nature:'#52604c',Museum:'#556984',Shopping:'#8d6889',Experience:'#9d782d',Sights:'#713c47'};ps.forEach(p=>{let color=colors[p.category]||'#713c47';let ico=L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:${color};border:3px solid white;border-radius:100%;box-shadow:0 0 0 1px ${color},0 2px 7px #3338"></div>`,iconSize:[14,14]});let m=L.marker([p.lat,p.lng],{icon:ico}).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.city)}<br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank">Directions ↗</a>`);m.placeId=p.id;markers.push(m)});loadVisiblePhotos();if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.12),{maxZoom:12})}function focusPin(id){const m=markers.find(x=>x.placeId===id);if(m){map.setView(m.getLatLng(),13);m.openPopup()}}
function render(){document.getElementById('tabs').innerHTML=tabs();renderContent();mode();loadVisiblePhotos()}
boot().then(()=>{if(sb)sb.channel('board-places').on('postgres_changes',{event:'*',schema:'public',table:'places'},async()=>{if(user){await loadShared();render()}}).subscribe()});
</script></body></html>
