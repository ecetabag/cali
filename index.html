async function fetchWikiPhoto(p){

 try{

  const pages=Object.values(json.query?.pages||{}).filter(x=>x.thumbnail?.source);

 }catch(e){}
}

function card(p){return `<article class="card"><div class="thumbWrap"><img class="thumb" data-place="${esc(p.id)}" src="${esc(photo(p))}" style="--h:${imageHeight(p)}px" alt="${esc(p.name)}"><div class="overlayActions"><button class="iconCircle ${p.favorite?'hearted':''}" data-action="like" data-id="${p.id}">♥</button><a class="iconCircle" href="${mapUrl(p)}" target="_blank">📍</a></div><div class="pinBadge">${esc(p.group==='Food'?(p.cuisine||cuisine(p)):p.group)}</div><div class="photoCredit" data-attribution="${esc(p.id)}"></div></div><div class="cardBody"><h3>${esc(p.name)}</h3><div class="meta"><span>${esc(p.city)}</span><span>${esc(p.group==='Food'?(p.cuisine||cuisine(p)):p.category)}</span>${p.day?`<span>📅 ${fmtDay(p.day)}</span>`:''}</div><p class="note">${esc(p.notes||('Added by '+p.added_by))}</p><div class="rowActions"><div class="left"><button class="tinybtn" data-action="visit" data-id="${p.id}">${p.status==='visited'?'Visited ✓':'Mark visited'}</button><button class="tinybtn" data-action="schedule" data-id="${p.id}">Add to day</button></div><div class="right"><a class="tinybtn" href="${esc(mapUrl(p))}" target="_blank" rel="noopener">Google Maps photos ↗</a><button class="tinybtn" data-action="edit" data-id="${p.id}">Edit</button></div></div></div></article>`; }
function renderBoard(list,title,sub=''){ const groups=chip==='All'?CATEGORIES.filter(c=>c!=='All').map(g=>[g,list.filter(p=>p.group===g)]).filter(([_,l])=>l.length):[[chip,list]]; return `<div class="boardHeader"><div><h2>${title}</h2><div class="muted">${list.length} items · ${sub}</div></div><div class="controls"><button class="secondary" id="headerAdd">Add item</button></div></div>${groups.map(([g,l])=>`<section><div class="sectionTitle">${g}</div><div class="masonry" style="--columns:${Math.min(4,l.length)}">${l.map(card).join('')}</div></section>`).join('')||'<div class="empty">Nothing here yet.</div>'}`; }
function km(a,b){const R=6371,toRad=x=>x*Math.PI/180;const dLat=toRad((b.lat||0)-(a.lat||0)),dLng=toRad((b.lng||0)-(a.lng||0));const aa=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat||0))*Math.cos(toRad(b.lat||0))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(aa),Math.sqrt(1-aa));}
function routeIdeas(){const favs=items.filter(p=>p.favorite && !p.day && p.lat!=null && p.lng!=null); const used=new Set(), groups=[]; for(const p of favs){ if(used.has(p.id)) continue; const cluster=[p]; used.add(p.id); for(const q of favs){ if(!used.has(q.id) && km(p,q)<10){ cluster.push(q); used.add(q.id);} } groups.push(cluster);} return groups.sort((a,b)=>b.length-a.length); }
function renderIdeas(){ const ideas=routeIdeas(); return `<div class="boardHeader"><div><h2>Proposed schedule ideas</h2><div class="muted">Heart places first. We group liked, unscheduled places that are close to each other.</div></div></div>${ideas.length?ideas.map((g,i)=>`<div class="ideaCard"><h3 style="margin:0 0 6px">Idea ${i+1} · ${esc(g[0].city)}</h3><div class="muted">${g.length} nearby favorites</div><div class="ideaPlaces">${g.map(p=>`<div class="ideaPlace"><img data-place="${esc(p.id)}" src="${esc(photo(p))}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.city)} · ${esc(p.group)}</div></div><div style="display:flex;gap:8px"><button class="tinybtn" data-action="schedule" data-id="${p.id}">Add to day</button><a class="tinybtn" target="_blank" href="${mapUrl(p)}">Maps</a></div></div>`).join('')}</div></div>`).join(''):`<div class="empty">No route ideas yet. Heart a few places in the same area and they’ll appear here.</div>`}`; }
function renderMap(){ return `<div class="boardHeader"><div><h2>Map</h2><div class="muted">Open places in Google Maps or browse them by area.</div></div></div><div class="mapLayout"><div class="mapList" id="mapList"></div><div id="map"></div></div>`; }
function drawMap(){ if(!map){ map=L.map('map').setView([37.78,-122.38],9); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);} markers.forEach(m=>map.removeLayer(m)); markers=[]; const visible=filterItems().filter(p=>p.lat!=null&&p.lng!=null); const listEl=document.getElementById('mapList'); listEl.innerHTML=visible.map(p=>`<div class="mapRow" data-focus="${p.id}"><img data-place="${esc(p.id)}" src="${esc(photo(p))}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.city)} · ${esc(p.group)}</div><div style="margin-top:8px;display:flex;gap:8px"><a class="tinybtn" href="${mapUrl(p)}" target="_blank">Open maps</a><button class="tinybtn" data-action="like" data-id="${p.id}">${p.favorite?'♥':'♡'}</button></div></div></div>`).join('')||'<div class="empty" style="margin:12px">No mapped items in this filter.</div>'; visible.forEach(p=>{ const marker=L.marker([p.lat,p.lng]).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.city)}<br><a target="_blank" href="${mapUrl(p)}">Open in Google Maps</a>`); marker.placeId=p.id; markers.push(marker); }); if(visible.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(.15),{maxZoom:12}); ensureVisiblePhotos(); setTimeout(()=>map.invalidateSize(),50); }
function focusMap(id){ const m=markers.find(x=>x.placeId===id); if(m){ map.setView(m.getLatLng(),13); m.openPopup(); } }

let dayMapInstance=null;const dayChecksKey='cali-daily-checks-v1';let dayChecks=JSON.parse(localStorage.getItem(dayChecksKey)||'{}');
function dailyMapsLink(place){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place);}
function dayRouteLink(stops){const unique=[...new Set(stops.filter(s=>s.location).map(s=>s.location))];if(!unique.length)return '#';if(unique.length===1)return dailyMapsLink(unique[0]);return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(unique[0])+'&destination='+encodeURIComponent(unique.at(-1))+(unique.length>2?'&waypoints='+encodeURIComponent(unique.slice(1,-1).join('|')):'');}
function dayDetails(d){const plan=DETAILED_PLAN.find(p=>p.day===d);const scheduled=items.filter(p=>p.day===d);return '<div class="detailHead"><div><div class="eyebrow">'+esc(fmtDay(d))+' · '+esc(plan.region)+'</div><h2>'+esc(plan.title)+'</h2><p>Detaylı günlük plan ve konumlar</p></div><a class="primary" target="_blank" rel="noopener" href="'+esc(dayRouteLink(plan.stops))+'">↗ Google Maps rotası</a></div><div class="dailyLayout"><div class="timeline">'+plan.stops.map((stop,i)=>{const key=d+'-'+i;return '<div class="timelineRow"><label class="timeCheck"><input type="checkbox" data-day-check="'+esc(key)+'" '+(dayChecks[key]?'checked':'')+' aria-label="Tamamlandı"></label><div class="timelineTime">'+esc(stop.time)+'</div><div class="timelineText"><b>'+esc(stop.title)+'</b><small>'+esc(stop.location)+'</small></div><a class="mapMini" target="_blank" rel="noopener" href="'+esc(dailyMapsLink(stop.location))+'">Konum ↗</a></div>'}).join('')+'</div><aside class="dayMapBox"><div class="mapLabel">📍 Günün haritası</div><div id="dayMap"></div><div class="mapFoot">Haritadaki noktalar yaklaşık konumları gösterir. Tam adres ve yol tarifi için Konum bağlantılarını kullanın.</div></aside></div>'+(scheduled.length?'<div class="extraPlaces"><h3>Bu güne eklenmiş diğer yerler</h3>'+scheduled.map(p=>'<div class="activity"><img data-place="'+esc(p.id)+'" src="'+esc(photo(p))+'"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.city)+'</div></div><a class="tinybtn" href="'+esc(mapUrl(p))+'" target="_blank">Haritada aç</a></div>').join('')+'</div>':'')+'<p class="travelNote">Saatler önerilen plan saatleridir; rezervasyon, çalışma saati ve feribot tarifelerini ayrıca kontrol edin.</p>';}
function drawDayMap(){const node=document.getElementById('dayMap');if(!node||!window.L)return; if(dayMapInstance){dayMapInstance.remove();dayMapInstance=null;}dayMapInstance=L.map(node,{scrollWheelZoom:false}).setView([37.77,-122.43],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(dayMapInstance);const day=DETAILED_PLAN.find(p=>p.day===selectedDay);const known=day.stops.map(s=>{const a=items.find(p=>p.lat!=null&&p.lng!=null&&(s.location.toLowerCase().includes(p.name.toLowerCase())||p.name.toLowerCase().includes(s.title.toLowerCase())));return a?{...a,time:s.time,title:s.title}:null}).filter(Boolean);const used=new Set(),all=known.filter(p=>{const k=p.lat+','+p.lng;if(used.has(k))return false;used.add(k);return true;});const markerGroup=L.featureGroup();const dayIndex=days().indexOf(selectedDay);(DAY_ANCHORS[dayIndex]||[]).forEach(([lat,lng,label])=>L.marker([lat,lng]).bindPopup('<b>'+esc(label)+'</b><br><a target="_blank" href="'+esc(dailyMapsLink(label+' California'))+'">Google Maps ↗</a>').addTo(markerGroup));all.forEach(p=>{if(!(DAY_ANCHORS[dayIndex]||[]).some(([lat,lng])=>Math.abs(lat-p.lat)<.003&&Math.abs(lng-p.lng)<.003))L.marker([p.lat,p.lng]).bindPopup('<b>'+esc(p.time+' · '+p.title)+'</b><br><a target="_blank" href="'+esc(mapUrl(p))+'">Google Maps ↗</a>').addTo(markerGroup)});if(markerGroup.getLayers().length){markerGroup.addTo(dayMapInstance);dayMapInstance.fitBounds(markerGroup.getBounds().pad(.28),{maxZoom:13});}else{const centers={'Berkeley':[37.87,-122.27],'Santa Cruz':[36.97,-122.03],'Monterey':[36.61,-121.9],'Gilroy':[37.02,-121.56],'San Francisco / Sausalito':[37.82,-122.45]};dayMapInstance.setView(centers[day.region]||[37.78,-122.44],11);}setTimeout(()=>dayMapInstance?.invalidateSize(),100);}

function renderCalendar(){return '<div class="boardHeader"><div><div class="eyebrow">3 — 14 KASIM 2026</div><h2>Gezi takvimi</h2><div class="muted">Bir güne tıkla: saat saat program, yapılacaklar ve harita.</div></div><div class="controls"><button class="secondary" id="dayRoute">Rotayı Google Maps’te aç</button><button class="primary" id="scheduleNew">＋ Yer ekle</button></div></div><div class="calendarGrid">'+DETAILED_PLAN.map((p,i)=>{const total=p.stops.length,done=p.stops.filter((_,j)=>dayChecks[p.day+'-'+j]).length;return '<button class="dayCard '+(selectedDay===p.day?'active':'')+'" data-day="'+p.day+'"><span class="dayNumber">'+(i+3)+'</span><span class="weekday">'+esc(fmtDay(p.day).split(',')[0])+'</span><strong>'+esc(p.title)+'</strong><span class="dayRegion">'+esc(p.region)+'</span><span class="dayProgress">✓ '+done+'/'+total+' tamamlandı</span></button>'}).join('')+'</div><section class="planPane" id="dayDetails">'+dayDetails(selectedDay)+'</section>';}
function renderChecklist(){ const visible=filterItems(); return `<div class="boardHeader"><div><h2>Checklist</h2><div class="muted">Want to visit, scheduled, visited.</div></div></div><div class="checkGroup">${visible.map(p=>`<label class="checkItem"><input type="checkbox" ${p.status==='visited'?'checked':''} data-action="visit" data-id="${p.id}"><img class="checkThumb" data-place="${esc(p.id)}" src="${esc(photo(p))}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.city)} · ${esc(p.group)}${p.day?` · ${fmtDay(p.day)}`:''}</div></div><a class="tinybtn" target="_blank" href="${mapUrl(p)}">Maps</a></label>`).join('')||'<div class="empty">No matching items.</div>'}</div>`; }
function render(){ if(dayMapInstance){dayMapInstance.remove();dayMapInstance=null;} groupSummary(); document.getElementById('tabs').innerHTML=tabs(); document.getElementById('chips').innerHTML=chips(); setModePill(); const visible=filterItems(); let html=''; if(tab==='Explore') html=renderBoard(visible,'Explore California','walking, nature, shopping, museums, and tech'); if(tab==='Food') html=renderBoard(visible.filter(p=>p.group==='Food'),'Food board','restaurants, dessert, brunch, and casual spots'); if(tab==='Liked') html=renderBoard(visible.filter(p=>p.favorite),'Liked places','everything you hearted, in one board'); if(tab==='Ideas') html=renderIdeas(); if(tab==='Map') html=renderMap(); if(tab==='Calendar') html=renderCalendar(); if(tab==='Checklist') html=renderChecklist(); document.getElementById('app').innerHTML=html; bindEvents(); if(tab==='Map') drawMap(); if(tab==='Calendar') drawDayMap(); ensureVisiblePhotos(); }
function bindEvents(){ document.getElementById('globalSearch').value=searchQuery; [...document.querySelectorAll('#tabs button')].forEach((b,i)=>b.onclick=()=>{tab=TABS[i]; chip='All'; render();}); [...document.querySelectorAll('#chips .chip')].forEach((b,i)=>b.onclick=()=>{chip=CATEGORIES[i]; render();}); document.getElementById('connectBtn').onclick=showSheetSettings; document.getElementById('addBtn').onclick=()=>showAdd(); document.getElementById('headerAdd')?.addEventListener('click',()=>showAdd()); document.getElementById('dayRoute')?.addEventListener('click',()=>window.open(dayRouteLink(DETAILED_PLAN.find(p=>p.day===selectedDay).stops),'_blank')); document.getElementById('scheduleNew')?.addEventListener('click',showDayPicker); document.querySelectorAll('[data-action="like"]').forEach(b=>b.onclick=e=>{e.preventDefault();likeToggle(b.dataset.id)}); document.querySelectorAll('[data-action="visit"]').forEach(b=>b.onchange=b.onclick=e=>{e.preventDefault();visitedToggle(b.dataset.id)}); document.querySelectorAll('[data-action="schedule"]').forEach(b=>b.onclick=()=>pickDay(b.dataset.id)); document.querySelectorAll('[data-action="edit"]').forEach(b=>b.onclick=()=>showAdd(b.dataset.id)); document.querySelectorAll('[data-action="unschedule"]').forEach(b=>b.onclick=()=>updateItem(b.dataset.id,{day:''})); document.querySelectorAll('[data-day]').forEach(d=>d.onclick=()=>{selectedDay=d.dataset.day; render();document.getElementById('dayDetails')?.scrollIntoView({behavior:'smooth',block:'start'});});document.querySelectorAll('[data-day-check]').forEach(c=>c.onchange=()=>{dayChecks[c.dataset.dayCheck]=c.checked;localStorage.setItem(dayChecksKey,JSON.stringify(dayChecks));const d=document.querySelector('[data-day="'+selectedDay+'"] .dayProgress');if(d){const p=DETAILED_PLAN.find(x=>x.day===selectedDay);d.textContent='✓ '+p.stops.filter((_,i)=>dayChecks[selectedDay+'-'+i]).length+'/'+p.stops.length+' tamamlandı';}}); document.querySelectorAll('[data-focus]').forEach(d=>d.onclick=(e)=>{if(e.target.tagName==='A'||e.target.tagName==='BUTTON')return; focusMap(d.dataset.focus);}); }
function modal(html){ document.getElementById('modalRoot').innerHTML=`<div class="modalBack" id="modalBack"><div class="modal">${html}</div></div>`; document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack') closeModal();}; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function showAdd(id=''){ const p=id?items.find(x=>x.id===id):null; modal(`<h2 style="margin-top:0">${p?'Edit item':'Add place or restaurant'}</h2><div class="muted">Use categories like Walking, Nature, Shopping, Museums, Food, or Tech.</div><form id="placeForm"><label>Name</label><input name="name" value="${esc(p?.name||'')}" required><div class="grid2"><div><label>City</label><input name="city" value="${esc(p?.city||'')}" required></div><div><label>Group</label><select name="group">${['Walking','Nature','Shopping','Museums','Food','Tech'].map(g=>`<option ${p?.group===g?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="grid2"><div><label>Category</label><select name="category">${['Place','Experience','Museum','Restaurant'].map(g=>`<option ${p?.category===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label>Day</label><select name="day"><option value="">Unscheduled</option>${days().map(d=>`<option value="${d}" ${p?.day===d?'selected':''}>${fmtDay(d)}</option>`).join('')}</select></div></div><label>Image URL (optional)</label><input name="image" value="${esc(p?.image||'')}" placeholder="https://..."><div class="grid2"><div><label>Latitude</label><input name="lat" type="number" step="any" value="${p?.lat??''}"></div><div><label>Longitude</label><input name="lng" type="number" step="any" value="${p?.lng??''}"></div></div><label>Cuisine (for restaurants)</label><input name="cuisine" value="${esc(p?.cuisine||cuisine(p||{}))}" placeholder="Italian, Japanese, American..."><label>Notes</label><textarea name="notes" rows="4">${esc(p?.notes||'')}</textarea><div class="actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button class="primary">Save</button></div></form>`); document.getElementById('cancelBtn').onclick=closeModal; document.getElementById('placeForm').onsubmit=e=>{e.preventDefault(); const fd=new FormData(e.target); addOrEdit({name:fd.get('name').trim(),city:fd.get('city').trim(),group:fd.get('group'),category:fd.get('category'),image:fd.get('image').trim(),cuisine:fd.get('cuisine').trim(),fallback:p?.fallback||'shopping',lat:fd.get('lat')?Number(fd.get('lat')):null,lng:fd.get('lng')?Number(fd.get('lng')):null,day:fd.get('day'),notes:fd.get('notes').trim()}, p?.id); }; }
function pickDay(id){ const p=items.find(x=>x.id===id); modal(`<h2 style="margin-top:0">Schedule ${esc(p.name)}</h2><select class="field" id="daySelect">${days().map(d=>`<option value="${d}" ${p.day===d?'selected':''}>${fmtDay(d)}</option>`).join('')}</select><div class="actions"><button class="secondary" id="modalCancel">Cancel</button><button class="primary" id="modalSave">Save</button></div>`); document.getElementById('modalCancel').onclick=closeModal; document.getElementById('modalSave').onclick=()=>{ updateItem(p.id,{day:document.getElementById('daySelect').value}); closeModal(); }; }
function showDayPicker(){ const unscheduled=items.filter(p=>!p.day); modal(`<h2 style="margin-top:0">Add to ${fmtDay(selectedDay)}</h2><select class="field" id="pickId">${unscheduled.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.city)}</option>`).join('')}</select><div class="actions"><button class="secondary" id="modalCancel">Cancel</button><button class="primary" id="modalSave">Add</button></div>`); document.getElementById('modalCancel').onclick=closeModal; document.getElementById('modalSave').onclick=()=>{ updateItem(document.getElementById('pickId').value,{day:selectedDay}); closeModal(); }; }
function dayDirections(){ const ps=items.filter(p=>p.day===selectedDay); if(!ps.length) return alert('No places in this day yet.'); const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(ps.at(-1).name+' '+ps.at(-1).city)+'&origin='+encodeURIComponent(ps[0].name+' '+ps[0].city)+(ps.length>2?'&waypoints='+encodeURIComponent(ps.slice(1,-1).map(p=>p.name+' '+p.city).join('|')):''); window.open(url,'_blank'); }

let sheetRequestId=0;window.__caliSheetCb={};
async function readSheet(){
 const cfg=config();if(!cfg.url||!cfg.code)throw Error('Missing Google Sheet URL or family code');
 const url=cfg.url.trim();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))throw Error('Enter the deployed Apps Script /exec web app URL.');
 return new Promise((resolve,reject)=>{
  const id='cb'+(++sheetRequestId);
  let script=document.createElement('script'),settled=false;
  const cleanup=()=>{delete window.__caliSheetCb[id];script.remove();clearTimeout(timeout);};
  const finish=(err,data)=>{if(settled)return;settled=true;cleanup();err?reject(err):resolve(data)};
  window.__caliSheetCb[id]=data=>{if(!data?.ok)return finish(Error(data?.error||'Google Sheet could not be read'));finish(null,data)};
  const timeout=setTimeout(()=>finish(Error('Google Sheet timed out; check deployment and family code')),18000);
  const q=new URLSearchParams({callback:'__caliSheetCb.'+id,code:cfg.code,nonce:String(Date.now())});
  script.onerror=()=>finish(Error('Could not reach Apps Script. Make sure Web app access is Anyone.'));
  script.src=url+'?'+q.toString();document.head.append(script);
 });
}
async function writeSheet(action,payload){
 const cfg=config();
 if(!cfg.url||!cfg.code)throw Error('Google Sheet is not configured');
 // POST cross-origin with a simple request and verify by a separate JSONP read.
 await fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,code:cfg.code,...payload})});
 const same=(a,b)=>String(a??'')===String(b??'');
 const confirmed=(rows)=>{
  if(action==='import')return payload.items.every(p=>{const x=rows.find(x=>x.id===p.id);return x&&(!p.favorite||x.favorite)&&(!p.day||x.day);});
  const x=rows.find(p=>p.id===payload.item.id),p=payload.item;
  return !!x&&same(x.name,p.name)&&same(x.city,p.city)&&same(x.day,p.day)
      &&same(x.status,p.status)&&Boolean(x.favorite)===Boolean(p.favorite)
      &&same(x.notes,p.notes)&&same(x.image,p.image)&&same(x.cuisine,p.cuisine);
 };
 let last=null;
 for(let attempt=0;attempt<4;attempt++){
  if(attempt)await new Promise(r=>setTimeout(r,1200));
  try{last=await readSheet();if(confirmed(last.items||[]))break}
  catch(e){if(attempt===3)throw e}
 }
 if(!last?.ok||!confirmed(last.items||[]))throw Error('Write could not be confirmed. Check the Sheet and deployment.');
 items=last.items||[];sheetActive=true;sheetLink=last.url||'';saveLocal();
}
function preserveLocalBeforeSheets(){const raw=localStorage.getItem('cali-todo-local');if(raw&&JSON.parse(raw).length)localStorage.setItem('cali-todo-before-sheets',raw);}
async function connectSheet(){
 if(!config().code)return;
 try{
  const data=await readSheet();
  preserveLocalBeforeSheets();sheetActive=true;sheetLink=data.url||'';items=data.items||[];
  render();saveLocal();
 }catch(e){sheetActive=false;console.warn('Sheet connection:',e);setModePill();}
}
async function refreshSheet(){
 if(!sheetActive||sheetBusy||document.hidden)return;
 sheetBusy=true;try{const data=await readSheet();items=data.items||[];sheetLink=data.url||sheetLink;saveLocal();render()}catch(e){console.warn('Refresh failed:',e)}finally{sheetBusy=false}
}
async function importCurrentBoard(){
 if(!sheetActive)return alert('Connect the sheet first.');
 const raw=localStorage.getItem('cali-todo-before-sheets')||localStorage.getItem('cali-todo-local');
 const local=raw?JSON.parse(raw):starterData();
 if(!local.length)return alert('Nothing to import.');
 if(!confirm('Import '+local.length+' items into Google Sheets? Existing rows with matching IDs will stay unchanged.'))return;
 try{await writeSheet('import',{items:local.map(p=>({...p,cuisine:p.cuisine||cuisine(p)}))});closeModal();render();alert('Imported missing places. The Google Sheet now powers the website.');}
 catch(e){alert('Import failed: '+e.message)}
}
function showSheetSettings(){
 const cfg=config();
 modal('<h2 style="margin-top:0">Connect Google Sheets</h2><p class="muted">Your Google Sheet becomes the itinerary and the database for every place, restaurant, liked item and schedule change. No Supabase, billing or Google API key required.</p><div class="notice">Open your existing <a href="https://docs.google.com/spreadsheets/d/1Ngl7b794tK86DbN3uBBaCoy1Wzi8EoSrD7m/edit" target="_blank">cal_todo Sheet</a>, open Extensions → Apps Script, paste the project’s Code.gs, set FAMILY_CODE under Script properties, run setupCaliforniaTodo, then Deploy as Web app (Execute as Me; access Anyone). See <a href="https://github.com/ecetabag/cali/blob/main/google-sheets/SETUP.md" target="_blank">setup instructions</a>.</div><div class="muted">Google Sheet endpoint is preconfigured for cal_todo. Enter the private code once.</div><label>Private family code</label><input id="sheetCode" type="password" placeholder="Private code stored in Apps Script settings" value="'+esc(cfg.code||'')+'"><label>Your name (shown on edits)</label><input id="sheetName" placeholder="Ece / Albert / Kaan / Işıl" value="'+esc(localStorage.getItem('cali-person-name')||'')+'"><div class="actions"><button class="secondary" id="closeSheet">Close</button><button class="primary" id="saveSheet">Connect</button></div>'+(sheetActive?'<div class="actions"><a class="secondary" href="'+esc(sheetLink)+'" target="_blank" rel="noopener">Open itinerary sheet ↗</a><button class="secondary" id="importSheet">Import my current board</button><button class="secondary" id="disconnectSheet">Disconnect</button></div>':''));
 document.getElementById('closeSheet').onclick=closeModal;
 document.getElementById('saveSheet').onclick=async()=>{
  const url=CALI_SCRIPT_URL,code=document.getElementById('sheetCode').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))return alert('Please use the deployed Apps Script URL ending in /exec.');
  if(!code)return alert('Enter your private family code from Script properties.');
  localStorage.setItem(configKey,JSON.stringify({url,code}));
  localStorage.setItem('cali-person-name',document.getElementById('sheetName').value.trim()||'Family');
  try{const data=await readSheet();preserveLocalBeforeSheets();sheetActive=true;sheetLink=data.url||'';items=data.items||[];saveLocal();render();showSheetSettings();}
  catch(e){sheetActive=false;alert('Connection failed: '+e.message)}
 };
 document.getElementById('importSheet')?.addEventListener('click',importCurrentBoard);
 document.getElementById('disconnectSheet')?.addEventListener('click',()=>{if(!confirm('Disconnect Google Sheets on this browser? Your Google Sheet data will not be deleted.'))return;localStorage.removeItem(configKey);sheetActive=false;sheetLink='';closeModal();render()});
}
function init(){ loadLocal(); document.getElementById('globalSearch').addEventListener('input',e=>{searchQuery=e.target.value; render();}); render(); connectSheet(); setInterval(refreshSheet,30000);window.addEventListener('focus',refreshSheet); }
init();
