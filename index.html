function km(a,b){const R=6371,toRad=x=>x*Math.PI/180;const dLat=toRad((b.lat||0)-(a.lat||0)),dLng=toRad((b.lng||0)-(a.lng||0));const aa=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat||0))*Math.cos(toRad(b.lat||0))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(aa),Math.sqrt(1-aa));}
function routeIdeas(){const favs=items.filter(p=>p.favorite && !p.day && p.lat!=null && p.lng!=null); const used=new Set(), groups=[]; for(const p of favs){ if(used.has(p.id)) continue; const cluster=[p]; used.add(p.id); for(const q of favs){ if(!used.has(q.id) && km(p,q)<10){ cluster.push(q); used.add(q.id);} } groups.push(cluster);} return groups.sort((a,b)=>b.length-a.length); }
function renderIdeas(){ const ideas=routeIdeas(); return `<div class="boardHeader"><div><h2>Proposed schedule ideas</h2><div class="muted">Heart places first. We group liked, unscheduled places that are close to each other.</div></div></div>${ideas.length?ideas.map((g,i)=>`<div class="ideaCard"><h3 style="margin:0 0 6px">Idea ${i+1} · ${esc(g[0].city)}</h3><div class="muted">${g.length} nearby favorites</div><div class="ideaPlaces">${g.map(p=>`<div class="ideaPlace"><img data-place="${esc(p.id)}" src="${esc(photo(p))}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.city)} · ${esc(p.group)}</div></div><div style="display:flex;gap:8px"><button class="tinybtn" data-action="schedule" data-id="${p.id}">Add to day</button><a class="tinybtn" target="_blank" href="${mapUrl(p)}">Maps</a></div></div>`).join('')}</div></div>`).join(''):`<div class="empty">No route ideas yet. Heart a few places in the same area and they’ll appear here.</div>`}`; }

let dayMapInstance=null;const dayChecksKey='cali-daily-checks-v1';let dayChecks=JSON.parse(localStorage.getItem(dayChecksKey)||'{}');
function dailyMapsLink(place){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place);}
function dayRouteLink(stops){const unique=[...new Set(stops.filter(s=>s.location).map(s=>s.location))];if(!unique.length)return '#';if(unique.length===1)return dailyMapsLink(unique[0]);return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(unique[0])+'&destination='+encodeURIComponent(unique.at(-1))+(unique.length>2?'&waypoints='+encodeURIComponent(unique.slice(1,-1).join('|')):'');}

function drawDayMap(){const node=document.getElementById('dayMap');if(!node||!window.L)return; if(dayMapInstance){dayMapInstance.remove();dayMapInstance=null;}dayMapInstance=L.map(node,{scrollWheelZoom:false}).setView([37.77,-122.43],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(dayMapInstance);const day=DETAILED_PLAN.find(p=>p.day===selectedDay);const known=day.stops.map(s=>{const a=items.find(p=>p.lat!=null&&p.lng!=null&&(s.location.toLowerCase().includes(p.name.toLowerCase())||p.name.toLowerCase().includes(s.title.toLowerCase())));return a?{...a,time:s.time,title:s.title}:null}).filter(Boolean);const used=new Set(),all=known.filter(p=>{const k=p.lat+','+p.lng;if(used.has(k))return false;used.add(k);return true;});const markerGroup=L.featureGroup();const dayIndex=days().indexOf(selectedDay);(DAY_ANCHORS[dayIndex]||[]).forEach(([lat,lng,label])=>L.marker([lat,lng]).bindPopup('<b>'+esc(label)+'</b><br><a target="_blank" href="'+esc(dailyMapsLink(label+' California'))+'">Google Maps ↗</a>').addTo(markerGroup));all.forEach(p=>{if(!(DAY_ANCHORS[dayIndex]||[]).some(([lat,lng])=>Math.abs(lat-p.lat)<.003&&Math.abs(lng-p.lng)<.003))L.marker([p.lat,p.lng]).bindPopup('<b>'+esc(p.time+' · '+p.title)+'</b><br><a target="_blank" href="'+esc(mapUrl(p))+'">Google Maps ↗</a>').addTo(markerGroup)});if(markerGroup.getLayers().length){markerGroup.addTo(dayMapInstance);dayMapInstance.fitBounds(markerGroup.getBounds().pad(.28),{maxZoom:13});}else{const centers={'Berkeley':[37.87,-122.27],'Santa Cruz':[36.97,-122.03],'Monterey':[36.61,-121.9],'Gilroy':[37.02,-121.56],'San Francisco / Sausalito':[37.82,-122.45]};dayMapInstance.setView(centers[day.region]||[37.78,-122.44],11);}setTimeout(()=>dayMapInstance?.invalidateSize(),100);}

function showAdd(id=''){ const p=id?items.find(x=>x.id===id):null; modal(`<h2 style="margin-top:0">${p?'Edit item':'Add place or restaurant'}</h2><div class="muted">Use categories like Walking, Nature, Shopping, Museums, Food, or Tech.</div><form id="placeForm"><label>Name</label><input name="name" value="${esc(p?.name||'')}" required><div class="grid2"><div><label>City</label><input name="city" value="${esc(p?.city||'')}" required></div><div><label>Group</label><select name="group">${['Walking','Nature','Shopping','Museums','Food','Tech'].map(g=>`<option ${p?.group===g?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="grid2"><div><label>Category</label><select name="category">${['Place','Experience','Museum','Restaurant'].map(g=>`<option ${p?.category===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label>Day</label><select name="day"><option value="">Unscheduled</option>${days().map(d=>`<option value="${d}" ${p?.day===d?'selected':''}>${fmtDay(d)}</option>`).join('')}</select></div></div><label>Image URL (optional)</label><input name="image" value="${esc(p?.image||'')}" placeholder="https://..."><div class="grid2"><div><label>Latitude</label><input name="lat" type="number" step="any" value="${p?.lat??''}"></div><div><label>Longitude</label><input name="lng" type="number" step="any" value="${p?.lng??''}"></div></div><label>Cuisine (for restaurants)</label><input name="cuisine" value="${esc(p?.cuisine||cuisine(p||{}))}" placeholder="Italian, Japanese, American..."><label>Notes</label><textarea name="notes" rows="4">${esc(p?.notes||'')}</textarea><div class="actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button class="primary">Save</button></div></form>`); document.getElementById('cancelBtn').onclick=closeModal; document.getElementById('placeForm').onsubmit=e=>{e.preventDefault(); const fd=new FormData(e.target); addOrEdit({name:fd.get('name').trim(),city:fd.get('city').trim(),group:fd.get('group'),category:fd.get('category'),image:fd.get('image').trim(),cuisine:fd.get('cuisine').trim(),fallback:p?.fallback||'shopping',lat:fd.get('lat')?Number(fd.get('lat')):null,lng:fd.get('lng')?Number(fd.get('lng')):null,day:fd.get('day'),notes:fd.get('notes').trim()}, p?.id); }; }
function pickDay(id){ const p=items.find(x=>x.id===id); modal(`<h2 style="margin-top:0">Schedule ${esc(p.name)}</h2><select class="field" id="daySelect">${days().map(d=>`<option value="${d}" ${p.day===d?'selected':''}>${fmtDay(d)}</option>`).join('')}</select><div class="actions"><button class="secondary" id="modalCancel">Cancel</button><button class="primary" id="modalSave">Save</button></div>`); document.getElementById('modalCancel').onclick=closeModal; document.getElementById('modalSave').onclick=()=>{ updateItem(p.id,{day:document.getElementById('daySelect').value}); closeModal(); }; }
function showDayPicker(){ const unscheduled=items.filter(p=>!p.day); modal(`<h2 style="margin-top:0">Add to ${fmtDay(selectedDay)}</h2><select class="field" id="pickId">${unscheduled.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.city)}</option>`).join('')}</select><div class="actions"><button class="secondary" id="modalCancel">Cancel</button><button class="primary" id="modalSave">Add</button></div>`); document.getElementById('modalCancel').onclick=closeModal; document.getElementById('modalSave').onclick=()=>{ updateItem(document.getElementById('pickId').value,{day:selectedDay}); closeModal(); }; }
function dayDirections(){ const ps=items.filter(p=>p.day===selectedDay); if(!ps.length) return alert('No places in this day yet.'); const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(ps.at(-1).name+' '+ps.at(-1).city)+'&origin='+encodeURIComponent(ps[0].name+' '+ps[0].city)+(ps.length>2?'&waypoints='+encodeURIComponent(ps.slice(1,-1).map(p=>p.name+' '+p.city).join('|')):''); window.open(url,'_blank'); }

let sheetRequestId=0;window.__caliSheetCb={};
async function readSheet(){
 const cfg=config();if(!cfg.url||!cfg.code)throw Error('Missing Google Sheet URL or family code');
 const url=cfg.url.trim();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))throw Error('Enter the deployed Apps Script /exec web app URL.');
 return new Promise((resolve,reject)=>{
  const id='cb'+(++sheetRequestId);
  let script=document.createElement('script'),settled=false;
  const cleanup=()=>{delete window.__caliSheetCb[id];script.remove();clearTimeout(timeout);};
  const finish=(err,data)=>{if(settled)return;settled=true;cleanup();err?reject(err):resolve(data)};
  window.__caliSheetCb[id]=data=>{if(!data?.ok)return finish(Error(data?.error||'Google Sheet could not be read'));finish(null,data)};
  const timeout=setTimeout(()=>finish(Error('Google Sheet timed out; check deployment and family code')),18000);
  const q=new URLSearchParams({callback:'__caliSheetCb.'+id,code:cfg.code,nonce:String(Date.now())});
  script.onerror=()=>finish(Error('Could not reach Apps Script. Make sure Web app access is Anyone.'));
  script.src=url+'?'+q.toString();document.head.append(script);
 });
}
async function writeSheet(action,payload){
 const cfg=config();
 if(!cfg.url||!cfg.code)throw Error('Google Sheet is not configured');
 // POST cross-origin with a simple request and verify by a separate JSONP read.
 await fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,code:cfg.code,...payload})});
 const same=(a,b)=>String(a??'')===String(b??'');
 const confirmed=(rows)=>{
  if(action==='import')return payload.items.every(p=>{const x=rows.find(x=>x.id===p.id);return x&&(!p.favorite||x.favorite)&&(!p.day||x.day);});
  const x=rows.find(p=>p.id===payload.item.id),p=payload.item;
  return !!x&&same(x.name,p.name)&&same(x.city,p.city)&&same(x.day,p.day)
      &&same(x.status,p.status)&&Boolean(x.favorite)===Boolean(p.favorite)
      &&same(x.notes,p.notes)&&same(x.image,p.image)&&same(x.cuisine,p.cuisine);
 };
 let last=null;
 for(let attempt=0;attempt<4;attempt++){
  if(attempt)await new Promise(r=>setTimeout(r,1200));
  try{last=await readSheet();if(confirmed(last.items||[]))break}
  catch(e){if(attempt===3)throw e}
 }
 if(!last?.ok||!confirmed(last.items||[]))throw Error('Write could not be confirmed. Check the Sheet and deployment.');
 sheetEmpty=false;sheetMissingPlaces=missingRestoredCount(last.items||[]);items=mergeRestoredPlaces(last.items||[]);sheetActive=true;sheetLink=last.url||'';saveLocal();
}
function preserveLocalBeforeSheets(){const raw=localStorage.getItem('cali-todo-local');if(raw&&JSON.parse(raw).length)localStorage.setItem('cali-todo-before-sheets',raw);}
async function useSheetData(data){
 sheetActive=true;sheetLink=data.url||sheetLink;
 const rows=Array.isArray(data.items)?data.items:[];
 sheetEmpty=rows.length===0;
 sheetMissingPlaces=missingRestoredCount(rows);
 if(sheetEmpty){items=mergeRestoredPlaces(recoveryPlaces());}
 else{preserveLocalBeforeSheets();items=mergeRestoredPlaces(rows);saveLocal();}
 render();
}
async function connectSheet(){
 if(!config().code)return;
 try{useSheetData(await readSheet());}
 catch(e){sheetActive=false;console.warn('Sheet connection:',e);setModePill();}
}
async function refreshSheet(){
 if(!sheetActive||sheetBusy||document.hidden)return;
 sheetBusy=true;
 try{useSheetData(await readSheet());}
 catch(e){console.warn('Refresh failed:',e)}
 finally{sheetBusy=false}
}
async function importCurrentBoard(){
 if(!sheetActive)return alert('Google Sheet bağlı değil.');
 const catalog=originalNonRestaurantCatalog();
 const current=await readSheet();
 const ids=new Set((current.items||[]).map(p=>p.id));
 const names=new Set((current.items||[]).map(p=>pid(p.name||'')));
 const missing=catalog.filter(p=>!ids.has(p.id)&&!names.has(pid(p.name)));
 if(!missing.length){sheetMissingPlaces=0;render();return alert('Tüm eski gezi yerleri Sheet’te mevcut.');}
 if(!confirm(missing.length+' restoran dışı eski gezi yerini Google Sheet’e eklemek istiyor musun? Mevcut kayıtlar değişmez.'))return;
 try{await writeSheet('import',{items:missing});sheetMissingPlaces=0;closeModal();render();alert('Eksik gezi yerleri Sheet’e eklendi.');}
 catch(e){alert('Aktarım başarısız: '+e.message);}
}
function showSheetSettings(){
 const cfg=config(), synced=sheetActive;
 const dot=synced?'🟢':cfg.code?'🟠':'⚪';
 modal('<div class="sheetModal"><div class="sheetLogo">▦</div><div class="eyebrow">SHARED TRIP BOARD</div><h2 style="margin:6px 0 7px;font-size:28px;letter-spacing:-.05em">Google Sheets bağlantısı</h2><p class="muted">Ailenle aynı gezi listesini kullan. Yerler, beğeniler ve plan değişiklikleri ortak Google Sheet’e kaydedilir.</p><div class="connectionBox"><b>'+dot+' '+(synced?'Bağlandı · senkronize':cfg.code?'Bağlantı kayıtlı · çevrimdışı':'Henüz bağlanmadı')+'</b><span>cal_todo · bağlantı adresi hazır</span></div><label for="sheetCode">Aile erişim kodu</label><div class="codeEntry"><input id="sheetCode" type="password" autocomplete="off" placeholder="Aile kodunu gir" value="'+esc(cfg.code||'')+'"><button type="button" class="secondary" id="toggleCode">Göster</button></div><label for="sheetName">Adın</label><input id="sheetName" placeholder="Ece / Albert / Kaan / Işıl" value="'+esc(localStorage.getItem('cali-person-name')||'')+'"><div class="actions"><button class="secondary" id="closeSheet">Kapat</button><button class="primary" id="saveSheet">'+(synced?'Bağlantıyı doğrula':'Bağlan ve senkronize et')+'</button></div><div class="sheetLinks"><a target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1Ngl7b794tK86DbN3uBBaCoy1Wzi8EoSrD7m/edit">↗ Google Sheet’i aç</a><a target="_blank" rel="noopener" href="https://github.com/ecetabag/cali/blob/main/google-sheets/SETUP.md">Kurulum yardımı ↗</a></div>'+(synced?'<div class="actions"><button class="secondary" id="refreshSheetBtn">↻ Şimdi yenile</button><button class="secondary" id="importSheet">Mevcut yerleri aktar</button><button class="secondary" id="disconnectSheet">Bağlantıyı kes</button></div>':'')+'<div class="privacyTip">🔒 Aile kodu yalnızca bu tarayıcıda saklanır, GitHub’a yüklenmez. Bu bağlantı bir Google OAuth hesabı girişi değil, özel aile koduyla çalışan Apps Script erişimidir.</div></div>');
 document.getElementById('closeSheet').onclick=closeModal;
 document.getElementById('toggleCode').onclick=()=>{const e=document.getElementById('sheetCode');e.type=e.type==='password'?'text':'password';document.getElementById('toggleCode').textContent=e.type==='password'?'Göster':'Gizle'};
 document.getElementById('saveSheet').onclick=async()=>{
 const code=document.getElementById('sheetCode').value.trim(),button=document.getElementById('saveSheet');
 if(!code)return alert('Aile erişim kodunu gir.');
 button.disabled=true;button.textContent='Bağlanıyor…';
 const previous=localStorage.getItem(configKey);
 localStorage.setItem(configKey,JSON.stringify({url:CALI_SCRIPT_URL,code}));
 localStorage.setItem('cali-person-name',document.getElementById('sheetName').value.trim()||'Family');
 try{useSheetData(await readSheet());showSheetSettings();}
 catch(e){if(previous===null)localStorage.removeItem(configKey);else localStorage.setItem(configKey,previous);alert('Bağlantı kurulamadı: '+e.message);button.disabled=false;button.textContent='Tekrar dene';setModePill();}
 };
 document.getElementById('refreshSheetBtn')?.addEventListener('click',async()=>{await refreshSheet();showSheetSettings()});
 document.getElementById('importSheet')?.addEventListener('click',importCurrentBoard);
 document.getElementById('disconnectSheet')?.addEventListener('click',()=>{if(!confirm('Bu tarayıcıdaki Google Sheets bağlantısı kesilsin mi? Sheet verileri silinmez.'))return;localStorage.removeItem(configKey);sheetActive=false;sheetLink='';closeModal();render();});
}
function init(){ loadLocal(); document.getElementById('globalSearch').addEventListener('input',e=>{searchQuery=e.target.value; render();}); render(); connectSheet(); setInterval(refreshSheet,30000);window.addEventListener('focus',refreshSheet); }
init();
